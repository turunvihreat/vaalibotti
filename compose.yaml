services:
  ev27:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # EV27_DATABASE_URL from .env takes precedence when using MySQL.
      EV27_DATABASE: /data/ev27.sqlite3
    volumes:
      - ev27-data:/data
    restart: unless-stopped
    init: true
volumes:
  ev27-data:
